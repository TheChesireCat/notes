# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: 1d94d9b5-2176-4082-8685-c78c4eab894c
  title: NETS notes
  description: PhD-level reference notes for the Northeastern Network Science core courses.
  github: https://github.com/TheChesireCat/notes
  exclude:
    - docs/**
    - CLAUDE.md
    - CONTEXT.md
    - TEMPLATE.md
  toc:
    - file: index.md
    - file: notation.md
    - file: nets-5116/index.md
      children:
        - title: Barabási chapter notes
          children:
            - pattern: nets-5116/barabasi/*.md
        - title: Barabási summaries
          children:
            - pattern: nets-5116/barabasi/summaries/*.md
        - title: Newman chapter notes
          children:
            - pattern: nets-5116/newman/*.md
    - file: nets-6116/index.md
      children:
        - pattern: nets-6116/??-*.md
    - file: phys-7335/index.md
      children:
        - pattern: phys-7335/??-*.md
    - file: nets-7332/index.md
      children:
        - title: Basics
          children:
            - pattern: nets-7332/basics/*.md
        - title: Readings
          children:
            - pattern: nets-7332/readings/*.md
site:
  template: book-theme
  options:
    favicon: favicon.svg
    logo_text: NETS notes
    folders: true
